name: Build loader
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar a dex
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          AJ=$ANDROID_HOME/platforms/$(ls $ANDROID_HOME/platforms | sort -V | tail -1)/android.jar
          mkdir -p out/classes
          javac -source 8 -target 8 -Xlint:-options -cp $AJ -d out/classes $(find src -name '*.java')
          $BT/d8 --release --min-api 21 --lib $AJ --output out $(find out/classes -name '*.class')
          mv out/classes.dex out/modloader.dex
      - uses: actions/upload-artifact@v4
        with:
          name: modloader-dex
          path: out/modloader.dex
